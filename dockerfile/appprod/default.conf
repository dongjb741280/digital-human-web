server {
    client_max_body_size 20m;
    client_body_buffer_size 20m;

    listen       8081;
    server_name  localhost;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /heilongjiang/wosaleapp/ai-digital-app/ {
         root   /usr/share/nginx/html;
         index  index.html;
         try_files $uri $uri/ /heilongjiang/wosaleapp/ai-digital-app/index.html;
    }

    location /heilongjiang/wosaleapp/ai-digital-app/admin-api/ { ## 后端项目 - 管理后台
        proxy_pass http://10.188.230.39:48080/admin-api/; ## 重要！！！proxy_pass 需要设置为后端项目所在服务器的 IP
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    #error_page  404              /404.html;

